<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="img/mark-green.png">
<link rel="apple-touch-icon" href="img/mark-green.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herboristerie El Baraka · Boutique</title>
<meta name="description" content="Herboristerie El Baraka, Mohammedia, depuis 1998. Produits de la ruche, produits naturels, compléments alimentaires et cosmétiques. Commande sur WhatsApp, paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a general herboristerie in two lights. Cream daylight for browsing and reading; every product
   sits on the same dark studio backdrop, so photographs and drawn packshots read as one collection. */
:root{
  --cream:#f6f1e4;   /* page */
  --paper:#fcf9f1;   /* cards, panels */
  --ink:#1b281e;     /* text */
  --muted:#635f4d;   /* secondary text */
  --green:#1d5631;   /* Baraka green */
  --gold:#d9a640;    /* honey gold */
  --rule:#e3d9c4;
  --studio:#302f31;  /* product backdrop: the colour of the honey photographs */
  --studio-hi:#423f43;
  --night-ink:#f3ecdc; --night-muted:#b8b1a2;
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-sc:'IM Fell English SC','IM Fell English',Georgia,serif;
  --f-kufi:'Readex Pro','Noto Naskh Arabic',system-ui,sans-serif;  /* Arabic labels: same family as the body text */
  --f-ruqaa:'Noto Naskh Arabic',serif;  /* Arabic headings: a plain naskh, easy to read on a phone */
  --f-body:'Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --wide:78rem; --hh:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 64px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.6}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.wrap{max-width:var(--wide);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.08}
:lang(fr) h1,:lang(fr) h2,:lang(fr) h3{font-family:var(--f-display)}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{font-family:var(--f-ruqaa);font-weight:700;line-height:1.5}
:lang(ar) body{font-size:17px;line-height:1.8}
h2{font-size:clamp(2rem,4.2vw,3.2rem)}
.lede{font-size:1.08rem;color:var(--muted);max-width:34em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;cursor:pointer;text-decoration:none;border-radius:999px;padding:.85rem 1.4rem;font-weight:500;font-size:.95rem;transition:transform .25s ease,background .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-1px)}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ink:hover{background:var(--green)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px currentColor}
.btn-gold{background:var(--gold);color:#1b1a14}
.btn-wa{background:#1f7a4a;color:#fff}
.btn-wa:hover{background:#196a3f}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.sh{display:flex;flex-direction:column;gap:.9rem;margin-bottom:2.4rem;max-width:46rem}
section.block{padding-block:clamp(4rem,8vw,7rem)}

/* product imagery: one studio for photos and packshots */
.studio{position:relative;display:block;aspect-ratio:1;border-radius:18px;overflow:hidden;background:radial-gradient(75% 62% at 50% 36%,var(--studio-hi),var(--studio) 72%)}
.studio::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,rgba(0,0,0,.18));pointer-events:none}
.studio img,.studio svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
/* real shop photographs fill their tile edge to edge; the backdrop only shows behind drawn packshots */
.studio img.ph{object-fit:cover}
.studio:has(img.ph)::after{background:linear-gradient(transparent,rgba(0,0,0,.08))}

/* developer view (?dev=1): what each product is */
.st{display:none}
.dev .st{display:inline-block;position:absolute;top:.5rem;inset-inline-start:.5rem;z-index:2;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:999px;background:#fff;color:#1b1a14}
.dev .st-shop{background:#cfe9c9}.dev .st-brand{background:#cfe0f2}.dev .st-example{background:#f2d9a8}
.devbar{background:#1b1a14;color:#f3ecdc;font-family:var(--f-mono);font-size:.74rem;padding:.55rem 16px;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:center}
.devbar a{color:var(--gold)}
.devbar .bad{color:#ff9d8a}

/* ribbon + header */
.ribbon{background:var(--green);color:#f3ecdc;text-align:center;font-size:.74rem;letter-spacing:.06em;padding:.4rem 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--cream)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--cream) 90%,transparent);backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--rule)}
.top .wrap{display:flex;align-items:center;gap:1.2rem;height:var(--hh)}
.brand{margin-inline-end:auto;display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--green)}
.brand img{height:44px;width:auto}
/* the founding year as live text: the logo's own 1998 line is too fine to read at header size */
.since{display:flex;flex-direction:column;gap:.05rem;padding-inline-start:.75rem;border-inline-start:1px solid color-mix(in srgb,var(--green) 35%,transparent);line-height:1.15}
.since b{font-weight:500;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.since b[dir=rtl]{font-family:var(--f-ruqaa);font-weight:600;font-size:.82rem;letter-spacing:0}
.nav{display:flex;gap:1.4rem;font-size:.9rem}
.nav a{text-decoration:none;opacity:.78;transition:opacity .2s}
.nav a:hover{opacity:1}
.sbtn{display:flex;align-items:center;gap:.55rem;border:0;cursor:pointer;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px;padding:.42rem .95rem .42rem .75rem;font-size:.86rem;color:var(--muted);min-width:13rem}
.sbtn svg{width:16px;height:16px;flex:none;color:var(--ink)}
.sbtn kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:.68rem;background:var(--cream);border-radius:4px;padding:.05rem .35rem;box-shadow:inset 0 0 0 1px var(--rule)}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:.28rem .7rem;cursor:pointer;font-size:.82rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.cartbtn{display:flex;align-items:center;gap:.45rem;border:0;background:transparent;cursor:pointer;padding:.3rem 0;font-size:.9rem}
.cartbtn svg{width:20px;height:20px}
.cartbtn .c{min-width:1.4rem;height:1.4rem;display:inline-grid;place-items:center;border-radius:1rem;background:var(--green);color:var(--cream);font-size:.72rem}
.cartbtn.bump .c{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.45)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:3.2rem;align-items:center;padding-block:clamp(2.5rem,5vw,4.5rem) clamp(3rem,6vw,5rem)}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.7rem);letter-spacing:-.01em;margin:.9rem 0 1.2rem}
:lang(ar) .hero h1{font-size:clamp(2.2rem,4.8vw,4rem)}
.hsearch{margin-top:1.8rem;display:flex;align-items:center;gap:.7rem;width:100%;max-width:32rem;border:0;cursor:text;text-align:start;background:var(--paper);border-radius:999px;padding:1rem 1.3rem;box-shadow:inset 0 0 0 1px var(--rule),0 20px 40px -28px rgba(40,28,8,.4);color:var(--muted);font-size:1rem;transition:box-shadow .3s}
.hsearch:hover{box-shadow:inset 0 0 0 1px var(--ink),0 24px 40px -24px rgba(40,28,8,.45)}
.hsearch svg{width:20px;height:20px;color:var(--ink);flex:none}
.quick{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem}
.quick button{all:unset;cursor:pointer;display:flex;align-items:center;gap:.45rem;padding:.36rem .85rem;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);font-size:.85rem;transition:box-shadow .2s,background .2s}
.quick button:hover{background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.quick i,.dotc{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.quick button:focus-visible{outline:2px solid var(--gold)}
/* hero: a mosaic of the shop's own shelf photographs */
.still{position:relative;margin:0;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:.6rem;aspect-ratio:1/.86}
.still .it{all:unset;position:relative;cursor:pointer;border-radius:18px;overflow:hidden;background:var(--studio);box-shadow:0 30px 50px -36px rgba(30,22,8,.7)}
.still .it:first-child{grid-row:1/3}
.still .it img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.still .it:hover img{transform:scale(1.04)}
.still .it:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.still .it span{position:absolute;inset:auto .5rem .5rem;padding:.25rem .55rem;border-radius:999px;background:rgba(246,241,228,.92);color:var(--ink);font-size:.72rem;line-height:1.3;width:max-content;max-width:calc(100% - 1rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.still figcaption{grid-column:1/-1;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* marquee */
.marquee{background:var(--green);color:#efe7d3;overflow:hidden;padding-block:.95rem;direction:ltr}
.marquee .row{display:flex;width:max-content;gap:2.4rem;animation:marq 60s linear infinite;align-items:baseline}
.marquee span{display:flex;align-items:baseline;gap:.7rem;white-space:nowrap}
.marquee b{font-family:var(--f-kufi);font-weight:600;font-size:1.25rem}
.marquee em{font-family:var(--f-sc);font-style:normal;letter-spacing:.12em;font-size:.95rem;opacity:.85}
.marquee span::after{content:"";width:.5rem;height:.5rem;margin-inline-start:1.8rem;background:var(--gold);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);align-self:center}
@keyframes marq{to{transform:translateX(-50%)}}

/* rayons */
.rayons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.1rem}
.ray{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.ray .studio{transition:box-shadow .4s,transform .45s cubic-bezier(.2,.7,.2,1)}
.ray:hover .studio,.ray:focus-visible .studio{transform:translateY(-4px);box-shadow:0 0 0 2px var(--c),0 24px 40px -22px rgba(30,22,8,.6)}
.ray:hover .studio svg,.ray:hover .studio img{transform:scale(1.05)}
.ray .glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 60%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);opacity:.0;transition:opacity .4s}
.ray:hover .glow{opacity:1}
.ray b{display:block;font-weight:500;font-size:.98rem;line-height:1.25}
.ray small{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--muted)}
.ray small span[dir=rtl]{font-family:var(--f-kufi);font-weight:600;color:var(--ink)}

/* the selection (dark band) */
.sel{background:var(--studio);color:var(--night-ink);padding-block:clamp(3.5rem,7vw,6rem);overflow:hidden}
.sel .eyebrow{color:var(--night-muted)}
.sel h2{color:var(--night-ink)}
.railhead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.6rem}
.arrows{display:flex;gap:.5rem}
.arrows button{width:2.6rem;height:2.6rem;border-radius:50%;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px currentColor;display:grid;place-items:center;opacity:.8;transition:opacity .2s,background .2s}
.arrows button:hover{opacity:1}
.arrows svg{width:16px;height:16px}
[dir=rtl] .arrows svg{transform:scaleX(-1)}
.rail{display:flex;gap:1.1rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:max(20px,calc((100vw - var(--wide)) / 2 + 20px));scroll-padding-inline:max(20px,calc((100vw - var(--wide)) / 2 + 20px));cursor:grab}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;scroll-snap-type:none}
.rail.dragging *{pointer-events:none}
.rail > *{scroll-snap-align:start;flex:none}
.sel .rail .card{width:19rem}
.sel .card .meta h3{color:var(--night-ink)}
.sel .card .meta .cat,.sel .card .meta .fmt{color:var(--night-muted)}
.sel .card .studio{background:radial-gradient(75% 62% at 50% 36%,#4a474b,#3a383b 72%)}

/* cards */
.card{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.card .tile{all:unset;box-sizing:border-box;cursor:pointer;display:block}
.card .tile:hover .studio svg,.card .tile:hover .studio img{transform:scale(1.045)}
.card .tile:focus-visible .studio{outline:2px solid var(--gold);outline-offset:3px}
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem .8rem;align-items:start}
.meta .cat{grid-column:1/-1;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.meta h3{font-size:1.12rem;line-height:1.25}
:lang(ar) .meta h3{font-size:1.18rem}
.meta .fmt{grid-column:1;font-size:.8rem;color:var(--muted)}
.meta .price{grid-row:2;grid-column:2;font-weight:500;white-space:nowrap;font-size:.95rem}
.meta .ctl{grid-row:3;grid-column:2;justify-self:end}
.meta .price small{font-weight:300;font-size:.75rem;color:var(--muted);margin-inline-end:.25rem}
.sel .meta .price small{color:var(--night-muted)}
.add{width:2.3rem;height:2.3rem;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px currentColor;background:transparent;cursor:pointer;font-size:1.2rem;line-height:1;display:grid;place-items:center;transition:background .2s,color .2s}
.add:hover{background:var(--ink);color:var(--cream)}
.sel .add:hover{background:var(--night-ink);color:var(--studio)}
.qty{display:inline-flex;align-items:center;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;height:2.3rem}
.qty button{border:0;background:transparent;width:2.1rem;height:100%;cursor:pointer;font-size:1rem}
.qty span{min-width:1.3rem;text-align:center;font-size:.92rem}

/* catalogue */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:30;background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding-block:.6rem}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:.45rem;padding:.45rem .95rem;border-radius:999px;font-size:.88rem;transition:background .25s,color .25s}
.tab small{font-size:.72rem;color:var(--muted)}
.tab:hover{background:var(--paper)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--cream)}
.tab[aria-selected="true"] small{color:#c9c2b0}
.tab:focus-visible{outline:2px solid var(--gold)}
.catwrap{padding-block:2.6rem 1rem;min-height:60vh}
.rrow{margin-bottom:3.2rem}
.rrow .railhead{margin-bottom:1.1rem}
.rrow .railhead h3{font-size:clamp(1.5rem,2.4vw,2rem);display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.rrow .railhead h3 span[dir=rtl]{font-family:var(--f-kufi);font-weight:600;font-size:1.1rem;color:var(--c)}
.rrow .line{margin:.35rem 0 0;color:var(--muted);font-size:.92rem}
.rrow .rail{margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));scroll-padding-inline:max(20px,env(safe-area-inset-left,0px))}
.rrow .rail .card{width:14.5rem}
.more{all:unset;cursor:pointer;font-size:.88rem;white-space:nowrap;display:flex;align-items:center;gap:.4rem;text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--rule)}
.more:hover{text-decoration-color:currentColor}
.ghead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.8rem}
.ghead h2{font-size:clamp(2rem,3.6vw,2.8rem);display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.ghead h2 span[dir=rtl]{font-family:var(--f-kufi);font-weight:600;font-size:1.3rem;color:var(--c)}
.ghead p{margin:.4rem 0 0;color:var(--muted)}
.ghead select{font:inherit;font-size:.88rem;background:var(--paper);border:0;box-shadow:inset 0 0 0 1px var(--rule);border-radius:999px;padding:.5rem .9rem;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,14.5rem),1fr));gap:1.6rem 1.2rem}
.grid .card{animation:cin .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes cin{from{transform:translateY(16px);opacity:.001}}

/* advice */
.advice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.chat{background:#e9e2d0;border-radius:24px;padding:1.4rem;display:flex;flex-direction:column;gap:.7rem;max-width:30rem;margin-inline:auto;width:100%;box-shadow:0 30px 60px -40px rgba(40,28,8,.5)}
.chat .who{display:flex;align-items:center;gap:.7rem;padding-bottom:.7rem;border-bottom:1px solid rgba(0,0,0,.06)}
.chat .who img{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--green);padding:.35rem;object-fit:contain}
.chat .who b{display:block;font-weight:500;font-size:.92rem}
.chat .who span{font-size:.75rem;color:var(--muted)}
.bub{max-width:82%;padding:.6rem .85rem;border-radius:14px;font-size:.92rem;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub.me{align-self:flex-end;background:#d9f2cf;border-end-end-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border-end-start-radius:4px}
.bub time{display:block;font-size:.68rem;color:var(--muted);text-align:end;margin-top:.15rem}
.small{font-size:.84rem;color:var(--muted)}

/* story, steps, faq, footer */
.story{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.story .front{border-radius:22px;overflow:hidden;box-shadow:0 40px 70px -40px rgba(40,28,8,.55)}
.story .front svg{display:block;width:100%;height:auto}
.promises{list-style:none;margin:1.8rem 0 0;padding:0;display:flex;flex-direction:column}
.promises li{display:grid;grid-template-columns:1.2rem 1fr;gap:.9rem;padding:1rem 0;border-top:1px solid var(--rule)}
.promises li::before{content:"";width:.8rem;height:.8rem;margin-top:.45rem;background:var(--green);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.promises b{display:block;font-weight:500}
.promises span{color:var(--muted);font-size:.93rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3rem;counter-reset:s}
.steps li{counter-increment:s;background:var(--paper);border-radius:20px;padding:1.6rem;box-shadow:0 1px 0 var(--rule)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--green);color:var(--cream);font-family:var(--f-display);font-size:1.15rem;margin-bottom:1.1rem}
.steps b{display:block;font-weight:500;font-size:1.05rem;margin-bottom:.3rem}
.steps span{color:var(--muted);font-size:.93rem}
.faq{max-width:50rem}
.faq details{border-top:1px solid var(--rule)}

/* sheets */
dialog.sheet{position:fixed;inset:0 0 0 auto;margin:0;height:100%;max-height:100%;width:min(33rem,100%);max-width:100%;border:0;padding:0;background:var(--cream);color:var(--ink);box-shadow:-20px 0 60px rgba(20,20,10,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl] dialog.sheet{inset:0 auto 0 0}
dialog.sheet[open]{display:flex;flex-direction:column;animation:sheetin .42s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] dialog.sheet[open]{animation-name:sheetinr}
@keyframes sheetin{from{transform:translateX(100%)}}
@keyframes sheetinr{from{transform:translateX(-100%)}}
dialog::backdrop{background:rgba(27,30,22,.45);backdrop-filter:blur(3px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.3rem;border-bottom:1px solid var(--rule)}
.sheet header h2{font-size:1.5rem}

.sheet .sc > *{flex-shrink:0}
.sheet .act{padding:1rem 1.3rem;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:.6rem;background:var(--paper)}
.dar{font-family:var(--f-ruqaa);font-weight:700;font-size:2rem;line-height:1.3;color:var(--c,var(--green))}
.dname{font-family:var(--f-display);font-size:1.75rem;line-height:1.2}

.dcat{display:flex;align-items:center;gap:.45rem}
.ddesc{margin:0;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opts > span{font-size:.82rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.45rem}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:.55rem .9rem;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-size:.9rem;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:5.6rem}
.seg button small{font-size:.76rem;color:var(--muted)}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.seg button:focus-visible{outline:2px solid var(--gold)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1.2rem;margin:0;font-size:.93rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.hexes{display:flex;gap:.28rem}
.hexes i{width:.95rem;height:.95rem;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:#e3d9c4}

.know{background:var(--paper);border-radius:14px;padding:1rem 1.1rem;font-size:.88rem;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.know b{color:var(--ink);font-weight:500}
.rel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.rel button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.rel .studio{border-radius:12px}
.rel b{font-weight:500;font-size:.8rem;line-height:1.25}
.rel span{font-size:.75rem;color:var(--muted)}
.rel button:focus-visible{outline:2px solid var(--gold)}
.buyrow{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.buyrow .price{font-family:var(--f-display);font-size:1.5rem}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.totals{display:flex;flex-direction:column;gap:.25rem;font-size:.93rem}
.totals div{display:flex;justify-content:space-between}
.totals .g{font-weight:500;font-size:1.08rem;border-top:1px solid var(--rule);padding-top:.45rem;margin-top:.2rem}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
legend{font-weight:500;margin-bottom:.45rem;padding:0}
.opt{display:flex;align-items:center;gap:.65rem;padding:.65rem .8rem;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);cursor:pointer}
.opt:has(input:checked){box-shadow:inset 0 0 0 2px var(--green)}
.opt input{accent-color:var(--green)}
.opt span{flex:1}
.opt small{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem}
label.f input,label.f textarea{font:inherit;font-size:1rem;padding:.65rem .75rem;border:0;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
label.f textarea{min-height:3.2rem;resize:vertical}
details.pv summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.preview{white-space:pre-wrap;font-size:.82rem;background:var(--paper);padding:.9rem;border-radius:10px;border-inline-start:3px solid #25d366;margin:.6rem 0 0;font-family:var(--f-body)}
.msg{font-size:.8rem;color:var(--muted);text-align:center;min-height:1.2em;margin:0}
.empty{text-align:center;padding:2.5rem 0;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;color:var(--ink);margin-bottom:.3rem}

/* search */
dialog.search{margin:min(12vh,7rem) auto auto;width:min(40rem,calc(100% - 24px));max-height:min(78vh,44rem);border:0;padding:0;border-radius:22px;background:var(--cream);color:var(--ink);box-shadow:0 40px 90px -30px rgba(20,18,8,.6)}

.sres{overflow-y:auto;padding:.6rem}
.sres .hit{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3.2rem 1fr auto;gap:.9rem;align-items:center;width:100%;padding:.5rem .6rem;border-radius:12px}

.sres .p{font-size:.88rem;white-space:nowrap}
.sres .group{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:.8rem .6rem .3rem}
.scats{display:flex;flex-wrap:wrap;gap:.45rem;padding:.4rem .6rem .8rem}
.scats button{all:unset;cursor:pointer;display:flex;align-items:center;gap:.45rem;padding:.36rem .85rem;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);font-size:.85rem}
.scats button:hover{background:var(--paper)}
.snone{padding:2rem 1rem;text-align:center;color:var(--muted)}

/* toast + flying image */
.toast{position:fixed;inset:auto auto calc(1.4rem + env(safe-area-inset-bottom,0px)) 50%;margin:0;border:0;color:inherit;transform:translate(-50%,160%);z-index:60;background:var(--ink);color:var(--cream);border-radius:999px;padding:.5rem .55rem .5rem .55rem;display:flex;align-items:center;gap:.8rem;font-size:.9rem;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.toast.on{transform:translate(-50%,0)}
@supports selector(:popover-open){.toast:not(:popover-open){display:none}}
.toast .studio{width:2.4rem;border-radius:50%}
.toast button{border:0;background:var(--gold);color:#1b1a14;border-radius:999px;padding:.35rem .85rem;cursor:pointer;font-weight:500}
.fly{position:fixed;z-index:70;pointer-events:none;border-radius:50%;overflow:hidden}

/* reveal on scroll: transform only, so content stays readable at rest */
@supports (animation-timeline: view()){
  .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
  @keyframes rise{from{transform:translateY(30px)}}
}

@media (max-width:1060px){ .nav{display:none} .rayons{grid-template-columns:repeat(4,minmax(0,1fr))} }

  .lang button{padding:.28rem .55rem}

  footer .wrap{grid-template-columns:1fr}

@media (prefers-reduced-motion:reduce){

}

    document.documentElement.style.setProperty('--hh', $('top').offsetHeight + 'px');
  }
  addEventListener('hashchange', () => { const h = /^#rayon-(\w+)$/.exec(location.hash); if (h && CAT[h[1]] && view !== h[1]) selectView(h[1], 'always'); });
  const m = /^#rayon-(\w+)$/.exec(location.hash);
  if (m && CAT[m[1]]) view = m[1];

  if (m && CAT[m[1]]) requestAnimationFrame(() => selectView(m[1], 'always'));
})();
