<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="img/mark-green.png">
<link rel="apple-touch-icon" href="img/mark-green.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herboristerie El Baraka · Boutique</title>
<meta name="description" content="Herboristerie El Baraka, Mohammedia. Sept miels du Maroc et les mélanges de la maison. Commande sur WhatsApp, paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;600;700&family=Aref+Ruqaa:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editorial shop in two lights. Cream daylight for the story and the guides; one dark, pinned
   gallery for the seven honeys, where the jars' own dark photographs sit as if on a lit shelf. */
:root{
  --cream:#f6f1e4;   /* page */
  --paper:#fcf9f1;   /* cards, panels */
  --ink:#1b281e;     /* text */
  --muted:#635f4d;   /* secondary text */
  --green:#1d5631;   /* Baraka green */
  --gold:#d9a640;    /* honey gold, on dark */
  --rule:#e3d9c4;
  --night:#302f31;   /* the gallery: the colour of the jar photographs' background */
  --night-ink:#f3ecdc;
  --night-muted:#b8b1a2;
  --f-display:'IM Fell English',Georgia,'Times New Roman',serif;
  --f-sc:'IM Fell English SC','IM Fell English',Georgia,serif;
  --f-kufi:'Reem Kufi','Amiri',sans-serif;
  --f-ruqaa:'Aref Ruqaa','Amiri',serif;
  --f-body:'Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --wide:76rem; --hh:64px; --acc:#c68517;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.6}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.wrap{max-width:var(--wide);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance;line-height:1.08}
:lang(fr) h1,:lang(fr) h2,:lang(fr) h3{font-family:var(--f-display)}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{font-family:var(--f-ruqaa);font-weight:700;line-height:1.35}
h2{font-size:clamp(2rem,4.4vw,3.4rem)}
.lede{font-size:1.08rem;color:var(--muted);max-width:34em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;cursor:pointer;text-decoration:none;border-radius:999px;padding:.85rem 1.4rem;font-weight:500;font-size:.95rem;transition:transform .25s ease,background .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-1px)}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ink:hover{background:var(--green)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px currentColor}
.btn-gold{background:var(--gold);color:#1b1a14}
.btn-gold:hover{background:#e7b955}
.btn-ghost-n{background:transparent;color:var(--night-ink);box-shadow:inset 0 0 0 1px rgba(243,236,220,.5)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}

/* ribbon + header */
.ribbon{background:var(--green);color:#f3ecdc;text-align:center;font-size:.74rem;letter-spacing:.06em;padding:.4rem 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--cream)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--cream) 90%,transparent);backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--rule)}
.top .wrap{display:flex;align-items:center;gap:1.4rem;height:var(--hh)}
.brand{margin-inline-end:auto;display:block}
.brand img{height:40px;width:auto}
.nav{display:flex;gap:1.5rem;font-size:.9rem}
.nav a{text-decoration:none;opacity:.78;transition:opacity .2s}
.nav a:hover{opacity:1}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:.28rem .7rem;cursor:pointer;font-size:.82rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.cartbtn{display:flex;align-items:center;gap:.45rem;border:0;background:transparent;cursor:pointer;padding:.3rem 0;font-size:.9rem}
.cartbtn svg{width:20px;height:20px}
.cartbtn .c{min-width:1.4rem;height:1.4rem;display:inline-grid;place-items:center;border-radius:1rem;background:var(--green);color:var(--cream);font-size:.72rem;transition:transform .3s}
.cartbtn.bump .c{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.45)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:3rem;align-items:center;padding-block:clamp(2.5rem,6vw,5rem) clamp(3rem,6vw,5.5rem)}
.hero h1{font-size:clamp(2.6rem,6.2vw,5.2rem);letter-spacing:-.01em;margin:.9rem 0 1.2rem}
:lang(ar) .hero h1{font-size:clamp(2.3rem,5.4vw,4.4rem)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}
.badges{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;margin:2rem 0 0;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}
.badges li{display:flex;align-items:center;gap:.45rem}
.badges i{width:.6rem;height:.6rem;background:var(--green);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.stack{position:relative;aspect-ratio:1/0.92;max-width:40rem;width:100%;margin-inline:auto}
.stack figure{position:absolute;margin:0;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(40,28,8,.45),0 8px 20px -10px rgba(40,28,8,.3);will-change:transform;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.stack figure img{width:100%;height:100%;object-fit:cover}
.stack .s1{width:62%;aspect-ratio:1;left:19%;top:6%;z-index:3}
.stack .s2{width:46%;aspect-ratio:1;left:0;top:30%;z-index:2;--r:-7deg}
.stack .s3{width:46%;aspect-ratio:1;right:0;top:24%;z-index:1;--r:6deg}
.stack .s2,.stack .s3{transform:rotate(var(--r)) translateY(var(--py,0px))}
.stack .s1{transform:translateY(var(--py,0px))}
.stack figcaption{position:absolute;left:1rem;bottom:.8rem;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#e8e0cf;opacity:.9}

/* marquee */
.marquee{background:var(--green);color:#efe7d3;overflow:hidden;padding-block:.95rem;direction:ltr}
.marquee .row{display:flex;width:max-content;gap:2.6rem;animation:marq 48s linear infinite;align-items:baseline}
.marquee span{display:flex;align-items:baseline;gap:.8rem;white-space:nowrap}
.marquee b{font-family:var(--f-kufi);font-weight:600;font-size:1.35rem}
.marquee em{font-family:var(--f-sc);font-style:normal;letter-spacing:.14em;font-size:.95rem;opacity:.85}
.marquee span::after{content:"";width:.5rem;height:.5rem;margin-inline-start:2rem;background:var(--gold);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);align-self:center}
@keyframes marq{to{transform:translateX(-50%)}}

/* the gallery (dark) */
.gallery{position:relative;background:var(--night);color:var(--night-ink)}
.gallery .stage{position:relative;overflow:hidden}
.gallery .stage > .wrap{width:100%}
.gallery .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(42% 60% at var(--gx,32%) 52%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 70%);transition:background .7s ease}
.gallery .head{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;padding-block:2.2rem 1.4rem}
.gallery .head .eyebrow{color:var(--night-muted)}
.gallery .head h2{margin-top:.5rem;font-size:clamp(1.8rem,3.4vw,2.7rem)}
.gallery .hint{font-size:.82rem;color:var(--night-muted);display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.gallery .hint svg{width:30px;height:12px}
.track{position:relative;z-index:1;display:flex;direction:ltr;gap:4vw;will-change:transform}
.panel{flex:none;opacity:.22;transform:scale(.96);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1);width:min(66rem,84vw);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,4rem);align-items:center}
.panel.on{opacity:1;transform:none}
.panel .info{transition:opacity .5s ease}
.panel:not(.on) .info{opacity:0}
.panel .ph{position:relative;aspect-ratio:1;max-height:62svh;width:100%;margin-inline:auto;cursor:zoom-in;border:0;padding:0;background:none}
.panel .ph img{width:100%;height:100%;object-fit:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(180deg,transparent 0,#000 4%,#000 88%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(180deg,transparent 0,#000 4%,#000 88%,transparent 100%);mask-composite:intersect}
.panel .info{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.panel .ar{font-family:var(--f-kufi);font-weight:700;font-size:clamp(3rem,7vw,5.6rem);line-height:1.15;color:var(--night-ink);margin:0}
.panel .fr{font-family:var(--f-display);font-size:clamp(1.4rem,2.4vw,2rem);margin:-.4rem 0 0;color:var(--night-ink)}
:lang(ar) .panel .fr{font-family:var(--f-sc);letter-spacing:.06em;font-size:1.1rem;color:var(--night-muted)}
.panel .note{color:var(--night-muted);font-size:1.02rem;margin:0;max-width:28em}
.meters{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;align-items:center;font-size:.8rem;color:var(--night-muted);margin:.2rem 0}
.hexes{display:flex;gap:.28rem}
.hexes i{width:.95rem;height:.95rem;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:rgba(243,236,220,.16)}
.hexes i.on{background:var(--gold)}
.panel .pair{font-size:.9rem;color:var(--night-ink);margin:0;display:flex;gap:.6rem}
.panel .pair b{font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--night-muted);padding-top:.28rem;white-space:nowrap}
.panel .buy{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem;margin-top:.6rem}
.panel .price{font-size:1.5rem;font-weight:400;font-family:var(--f-display)}
.panel .price small{font-family:var(--f-body);font-size:.8rem;color:var(--night-muted);margin-inline-start:.4rem}
.progress{position:relative;z-index:2;display:flex;gap:.4rem;align-items:center;padding-block:1.6rem 2.2rem}
.progress button{all:unset;cursor:pointer;flex:1;height:22px;display:flex;align-items:center}
.progress button i{display:block;width:100%;height:3px;border-radius:3px;background:rgba(243,236,220,.18);transition:background .4s,height .3s}
.progress button[aria-current="true"] i{background:color-mix(in srgb,var(--c) 62%,#f3ecdc);height:5px}
.progress button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.progress .now{margin-inline-start:1rem;font-size:.82rem;color:var(--night-muted);white-space:nowrap;min-width:9rem;text-align:end}
/* pinned mode (wide screens): the stage holds still while the jars slide */
.gallery.pinned .stage{position:sticky;top:var(--hh);height:calc(100svh - var(--hh));display:flex;flex-direction:column;justify-content:space-between}
.gallery.pinned .track{padding-inline:calc((100vw - min(66rem,84vw)) / 2)}
/* carousel mode (phones, reduced motion) */
.gallery.carousel .track{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:8vw;gap:6vw;padding-bottom:.4rem}
.gallery.carousel .track::-webkit-scrollbar{display:none}
.gallery.carousel .panel{scroll-snap-align:center;width:84vw;grid-template-columns:1fr;gap:1rem}
.gallery.carousel .panel.on{opacity:1;transform:none}
.panel .info{transition:opacity .5s ease}
.panel:not(.on) .info{opacity:0}
.panel .ph{max-height:none;width:88%}

/* sections on cream */
section.block{padding-block:clamp(4rem,9vw,7.5rem)}
.sh{display:flex;flex-direction:column;gap:.9rem;margin-bottom:2.6rem;max-width:44rem}

/* taste map */
.guide{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.mapwrap{direction:ltr;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:.6rem .8rem;max-width:34rem;width:100%}
.yax{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);letter-spacing:.04em}
.yax b,.xax b{font-family:var(--f-mono);font-weight:400;text-transform:uppercase;letter-spacing:.14em;color:var(--ink);font-size:.68rem}
.xax{grid-column:2;display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.map{position:relative;aspect-ratio:1;border-radius:18px;background:
  linear-gradient(var(--rule) 1px,transparent 1px) 0 0/20% 20%,linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/20% 20%,
  radial-gradient(120% 120% at 0% 0%,#fffaf0,#f1e8d4);box-shadow:inset 0 0 0 1px var(--rule);direction:ltr}
.dot{all:unset;box-sizing:border-box;position:absolute;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
  background:var(--night) center/cover;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--c),0 10px 24px -8px rgba(40,28,8,.5);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.dot:hover{transform:translate(-50%,-50%) scale(1.08)}
.dot[aria-pressed="true"]{transform:translate(-50%,-50%) scale(1.18);z-index:2;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--c),0 16px 30px -8px rgba(40,28,8,.55)}
.dot span{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);font-family:var(--f-kufi);font-weight:600;font-size:.82rem;white-space:nowrap;color:var(--ink)}
.pick{background:var(--paper);border-radius:22px;padding:1.6rem;display:grid;grid-template-columns:9rem 1fr;gap:1.4rem;align-items:center;box-shadow:0 1px 0 var(--rule),0 30px 60px -40px rgba(40,28,8,.35);min-width:0}
.pick .pimg{border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--night)}
.pick .pimg img{width:100%;height:100%;object-fit:cover}
.pick h3{font-size:1.7rem}
.pick .par{font-family:var(--f-kufi);font-weight:700;font-size:1.6rem;color:var(--c,var(--green));line-height:1.2}
.pick p{margin:.4rem 0 0;color:var(--muted);font-size:.95rem}
.pick .row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-top:1rem}
.pick .price{font-family:var(--f-display);font-size:1.35rem}

/* gift box */
.boxsec{background:var(--paper);border-block:1px solid var(--rule)}
.boxgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.giftbox{position:relative;max-width:36rem;width:100%;margin-inline:auto;aspect-ratio:1.45;direction:ltr}
.giftbox .lid{position:absolute;left:9%;right:9%;top:0;height:33%;background:linear-gradient(#22603a,#1a4e2e);border-radius:12px 12px 0 0;box-shadow:inset 0 -10px 18px rgba(0,0,0,.28);display:grid;place-items:center;padding-bottom:5%}
.giftbox .lid img{position:absolute;left:50%;top:10%;height:58%;width:auto;max-width:none;transform:translateX(-50%);opacity:.95}
.giftbox .body{position:absolute;left:0;right:0;bottom:0;height:72%;background:linear-gradient(#1f5a35,#164429);border-radius:6px 6px 14px 14px;box-shadow:0 40px 60px -30px rgba(20,30,14,.6);padding:5% 5% 9%;display:grid;grid-template-columns:repeat(3,1fr);gap:4%}
.giftbox .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(#174a2c,#123a23);border-radius:0 0 14px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.slot{position:relative;border-radius:8px;background:var(--night);box-shadow:inset 0 8px 18px rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:center}
.slot:empty::before{content:"+";font-size:1.8rem;color:rgba(243,236,220,.35);font-weight:300}
.slot img{position:absolute;inset:-6% -18% -2%;width:136%;height:108%;max-width:none;object-fit:cover;animation:drop .55s cubic-bezier(.2,.8,.25,1.2)}
@keyframes drop{from{transform:translateY(-38%);opacity:0}}
.boxside{display:flex;flex-direction:column;gap:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:.55rem;padding:.35rem .9rem .35rem .35rem;border-radius:999px;background:var(--cream);box-shadow:inset 0 0 0 1px var(--rule);font-size:.88rem;transition:box-shadow .2s,background .2s}
.chip img{width:2rem;height:2rem;border-radius:50%;object-fit:cover}
.chip b{font-family:var(--f-kufi);font-weight:600}
.chip[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip[aria-disabled="true"]{opacity:.45}
.boxtotal{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;border-top:1px solid var(--rule);padding-top:1rem}
.boxtotal .price{font-family:var(--f-display);font-size:1.6rem}
.small{font-size:.84rem;color:var(--muted)}

/* house blends */
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.2rem}
.hcard{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.hvis{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;padding:12%;border-radius:16px;background:radial-gradient(130% 100% at 30% 0%,#efe4cc,#e0d2b4);box-shadow:inset 0 0 0 1px rgba(120,90,40,.12);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.hvis:hover{transform:translateY(-3px)}
.front-clip{position:relative;aspect-ratio:7/6;overflow:hidden;border-radius:3px;box-shadow:0 18px 30px -18px rgba(40,28,8,.6),0 2px 4px rgba(40,28,8,.15);transform:rotate(-1.2deg)}
.hcard:nth-child(even) .front-clip{transform:rotate(1deg)}
.front-inner{position:absolute;top:0;left:-92.857%;width:285.714%}
.hmeta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.1rem .8rem;align-items:start}
.hmeta h3{font-size:1.15rem;line-height:1.25}
:lang(ar) .hmeta h3{font-size:1.25rem}
.hmeta .sub{grid-column:1;font-size:.8rem;color:var(--muted)}
.hmeta .price{grid-row:1;grid-column:2;font-weight:500;white-space:nowrap}
.hmeta .ctl{grid-row:2;grid-column:2;justify-self:end}

/* add / qty */
.add{width:2.3rem;height:2.3rem;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px currentColor;background:transparent;cursor:pointer;font-size:1.2rem;line-height:1;display:grid;place-items:center;transition:background .2s,color .2s}
.add:hover{background:var(--ink);color:var(--cream)}
.qty{display:inline-flex;align-items:center;border-radius:999px;box-shadow:inset 0 0 0 1px currentColor;height:2.3rem}
.qty button{border:0;background:transparent;width:2.1rem;height:100%;cursor:pointer;font-size:1rem}
.qty span{min-width:1.3rem;text-align:center;font-size:.92rem}
.gallery .qty{height:2.9rem}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:center}
.story .front{border-radius:20px;overflow:hidden;box-shadow:0 40px 70px -40px rgba(40,28,8,.55)}
.story .front svg{display:block;width:100%;height:auto}
.promises{list-style:none;margin:1.8rem 0 0;padding:0;display:flex;flex-direction:column}
.promises li{display:grid;grid-template-columns:1.2rem 1fr;gap:.9rem;padding:1rem 0;border-top:1px solid var(--rule)}
.promises li::before{content:"";width:.8rem;height:.8rem;margin-top:.45rem;background:var(--green);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}

    const slots = $('slots').children;
    for (let i = 0; i < 3; i++) {
      const id = box[i], cur = slots[i].dataset.id;
      if (id !== cur) { slots[i].dataset.id = id || ''; slots[i].innerHTML = id ? `<img src="${photo(id)}" alt="">` : ''; }
    }
    $('bCount').textContent = `${box.length} / 3`;
    $('bTotal').textContent = box.length ? money(box.reduce((s, id) => s + byId[id].price, 0)) : '—';
    $('bAdd').disabled = box.length !== 3;
  }
  $('bChips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-chip]'); if (!c) return;
    const id = c.dataset.chip, k = box.indexOf(id);
    if (k >= 0) box.splice(k, 1); else if (box.length < 3) box.push(id); else { toastText(t('boxFull')); return; }
    renderBox();
  });
  $('bClear').onclick = () => { box = []; renderBox(); };
  $('bAdd').onclick = () => { if (box.length !== 3) return; const k = 'box:' + box.join('+'); setQty(k, (cart[k] || 0) + 1); fly($('slots'), photo(box[1], true)); box = []; renderBox(); };

  /* ---------------- house blends ---------------- */
  function renderHouse(){
    $('hgrid').innerHTML = HOUSE.map(p => `<article class="hcard rv">
      <button class="hvis" type="button" data-open="${p.id}" aria-label="${t('details')} : ${nameOf(p)}">${front(p)}</button>
      <div class="hmeta"><h3>${nameOf(p)}</h3><span class="price num">${money(p.price)}</span><span class="sub">${lang === 'ar' ? p.arSub : p.frSub} · <bdi>${p.size}</bdi></span><span class="ctl" data-ctl="${p.id}">${control(p.id)}</span></div></article>`).join('');
  }

  /* ---------------- detail sheet ---------------- */
  function related(p){
    return HONEY.filter(q => q.id !== p.id).map(q => [q, Math.hypot(q.sweet - p.sweet, q.strong - p.strong)]).sort((a, b) => a[1] - b[1]).slice(0, 2).map(x => x[0]);
  }
  function renderDetail(){
    const p = current; if (!p) return;
    const c = p.kind === 'honey' ? ACC[p.id] : 'var(--green)';
    $('detail').style.setProperty('--c', c);
    let html;
    if (p.kind === 'honey') {
      html = `<div class="dview"><img src="${photo(p.id)}" alt="${nameOf(p)}"></div>
        <div><div class="dar"><bdi>${BIG[p.id]}</bdi></div><div class="dname">${p.fr}</div></div>
        <dl class="dl"><dt>${t('taste')}</dt><dd>${lang === 'ar' ? p.noteAr : p.noteFr}</dd><dt>${t('sweet')}</dt><dd>${hexes(p.sweet)}</dd><dt>${t('strong')}</dt><dd>${hexes(p.strong)}</dd>
        <dt>${t('pair')}</dt><dd>${lang === 'ar' ? p.pairAr : p.pairFr}</dd><dt>${t('origin')}</dt><dd>${t('originV')}</dd><dt>${t('size')}</dt><dd class="num"><bdi>${p.size}</bdi></dd></dl>
        <div class="know">${t('know')}</div>
        <div><p class="eyebrow" style="margin:0 0 .6rem">${t('related')}</p><div class="rel">${related(p).map(q => `<button type="button" data-open="${q.id}"><img src="${photo(q.id, true)}" alt=""><span><b dir="rtl">${BIG[q.id]}</b><span>${q.fr} · ${money(q.price)}</span></span></button>`).join('')}</div></div>`;
    } else {
      const L = E.LINES[p.line];
      html = `<div class="dview house">${front(p)}</div>
        <div><div class="dar" style="font-family:var(--f-ruqaa)"><bdi>${p.ar}</bdi></div><div class="dname">${p.fr}</div></div>
        <dl class="dl"><dt>${t('family')}</dt><dd>${lang === 'ar' ? L.ar : L.fr}</dd><dt>${t('size')}</dt><dd class="num"><bdi>${p.size}</bdi></dd>
        ${p.useFr ? `<dt>${t('use')}</dt><dd>${lang === 'ar' ? p.useAr : p.useFr}</dd>` : ''}</dl>
        ${p.real ? '' : `<div class="know">${t('example')}</div>`}`;
    }
    $('dBody').innerHTML = html;
    $('dBody').scrollTop = 0;
    renderDetailBar();
  }
  function renderDetailBar(){
    if (!current) return;
    $('dPrice').textContent = money(current.price);
    $('dCtl').innerHTML = cart[current.id] ? `<span data-ctl="${current.id}">${control(current.id)}</span>` : '';
    $('dAdd').textContent = cart[current.id] ? t('inCart') + ' ✓' : t('add');
  }
  function openDetail(id){
    current = byId[id]; if (!current) return;
    renderDetail();
    if (!$('detail').open) $('detail').showModal();
  }
  $('dAdd').onclick = () => { if (!current) return; if (!cart[current.id]) { setQty(current.id, 1); fly($('dBody').querySelector('.dview'), current.kind === 'honey' ? photo(current.id, true) : 'img/mark-gold.png'); } else { $('detail').close(); openCart(); } };

  /* ---------------- cart ---------------- */
  function setQty(k, q){
    if (q <= 0) delete cart[k]; else cart[k] = Math.min(q, 99);
    save();
    refreshControls(k);
    renderCart();
    renderDetailBar();
  }
  function refreshControls(k){
    document.querySelectorAll(`[data-ctl="${k}"]`).forEach(el => { if (el.closest('#dCtl') && !cart[k]) el.remove(); else el.innerHTML = control(k); });
    document.querySelectorAll(`[data-gbuy="${k}"]`).forEach(el => el.innerHTML = galleryBuy(k));
  }
  function bump(){ const b = $('openCart'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  let toastTimer;
  function toastText(msg, img){
    const tEl = $('toast');
    tEl.querySelector('span').textContent = msg;
    $('toastImg').src = img || 'img/mark-gold.png';
    $('toastBtn').hidden = !img;
    tEl.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => tEl.classList.remove('on'), 2600);
  }
  function fly(fromEl, img){
    bump();
    toastText(t('added'), img);
    if (reduce || !fromEl || !fromEl.isConnected) return;
    const a = fromEl.getBoundingClientRect(), b = $('count').getBoundingClientRect();
    const f = document.createElement('img'); f.src = img; f.className = 'fly'; f.alt = '';
    const s = Math.min(90, a.width * 0.5);
    Object.assign(f.style, { width: s + 'px', height: s + 'px', left: (a.left + a.width / 2 - s / 2) + 'px', top: (a.top + a.height / 2 - s / 2) + 'px' });
    document.body.appendChild(f);
    const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
    const an = f.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx * 0.5}px,${dy * 0.5 - 80}px) scale(.7)`, opacity: 1, offset: .55 }, { transform: `translate(${dx}px,${dy}px) scale(.15)`, opacity: .4 }], { duration: 750, easing: 'cubic-bezier(.4,.1,.3,1)' });
    an.onfinish = () => f.remove();
  }
  document.addEventListener('click', (e) => {
    const o = e.target.closest('[data-open]'); if (o) { openDetail(o.dataset.open); return; }
    const b = e.target.closest('[data-add],[data-inc],[data-dec]'); if (!b) return;
    const k = b.dataset.add || b.dataset.inc || b.dataset.dec;
    // find where the jar flies from before the button is re-rendered
    const scope = b.closest('.panel,.pick,.hcard');
    const src = scope ? (scope.querySelector('.ph,.pimg,.hvis') || scope) : null;
    setQty(k, (cart[k] || 0) + (b.dataset.dec ? -1 : 1));
    if (b.dataset.add) fly(src, byId[k] && byId[k].kind === 'honey' ? photo(k, true) : 'img/mark-gold.png');
  });
  $('toastBtn').onclick = () => openCart();

  const mode = () => (document.querySelector('input[name=mode]:checked') || {}).value || 'pick';
  function message(){
    const keys = Object.keys(cart).filter(valid);
    const L = keys.map(k => `• ${lineName(k)} (⁦${isBox(k) ? '3 × 500 g' : byId[k].size}⁩) × ${cart[k]} = ${money(priceOf(k) * cart[k])}`);
    const sub = keys.reduce((s, k) => s + priceOf(k) * cart[k], 0);
    const m = mode(), fee = m === 'moh' ? FEE_MOH : 0;
    const name = $('f-name').value.trim(), phone = $('f-phone').value.trim(), addr = $('f-addr').value.trim(), note = $('f-note').value.trim();
    const out = [t('mHead'), ...L, '', `${t('total')}: ${money(sub + fee)}${fee ? ` (${t('fee')} ${money(fee)})` : ''}`, t('mPay'), m === 'pick' ? t('mPickL') : m === 'moh' ? t('mMohL') : t('mFarL')];
    if (name) out.push(`${t('mName')}: ${name}`);
    if (phone) out.push(`${t('mPhone')}: ${phone}`);
    if (m !== 'pick' && addr) out.push(`${t('mAddr')}: ${addr}`);
    if (note) out.push(`${t('mNote')}: ${note}`);
    return { text: out.join('\n'), sub, fee, n: keys.length };
  }
  function thumb(k){
    if (isBox(k)) return `<div class="th bx"><img src="img/mark-gold.png" alt=""></div>`;
    const p = byId[k];
    return p.kind === 'honey' ? `<div class="th"><img src="${photo(k, true)}" alt=""></div>` : `<div class="th hs" dir="rtl">${p.big || p.ar}</div>`;
  }
  function renderCart(){
    const keys = Object.keys(cart).filter(valid);
    $('count').textContent = keys.reduce((s, k) => s + cart[k], 0);
    $('lines').innerHTML = keys.map(k => `<li>${thumb(k)}<div><div class="n">${lineName(k)}</div><div class="s num"><bdi>${isBox(k) ? '3 × 500 g' : byId[k].size}</bdi> · <bdi>${money(priceOf(k))}</bdi></div></div><div class="r"><span class="num">${money(priceOf(k) * cart[k])}</span><span data-ctl="${k}">${control(k)}</span></div></li>`).join('');
    const has = keys.length > 0;
    $('empty').hidden = has; $('form').hidden = !has; $('totals').hidden = !has; $('pvWrap').hidden = !has;
    $('addrWrap').hidden = mode() === 'pick';
    $('feeLbl').textContent = money(FEE_MOH);
    const m = message();
    $('totals').innerHTML = `<div><span>${t('sub')}</span><span class="num">${money(m.sub)}</span></div><div><span>${t('fee')}</span><span class="num">${mode() === 'far' ? t('tbc') : money(m.fee)}</span></div><div class="g"><span>${t('total')}</span><span class="num">${money(m.sub + m.fee)}</span></div>`;
    $('preview').textContent = m.n ? m.text : t('need');
    $('send').href = m.n ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m.text)}` : '#';
    $('send').setAttribute('aria-disabled', m.n ? 'false' : 'true');
    $('send').style.opacity = m.n ? '' : '.4'; $('send').style.pointerEvents = m.n ? '' : 'none';
  }
  $('form').addEventListener('input', renderCart);
  $('form').addEventListener('change', renderCart);
  $('form').addEventListener('submit', (e) => e.preventDefault());
  function openCart(){ if ($('detail').open) $('detail').close(); renderCart(); $('cart').showModal(); }
  $('openCart').onclick = openCart;
  document.querySelectorAll('dialog.sheet').forEach(d => {
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    d.querySelector('[data-close]').onclick = () => d.close();
  });
  $('copy').onclick = () => {
    const text = message().text;
    const fallback = () => { $('pvWrap').open = true; const r = document.createRange(); r.selectNodeContents($('preview')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('msg').textContent = t('copyFail'); };
    try { navigator.clipboard.writeText(text).then(() => { $('msg').textContent = t('copied'); }, fallback); } catch (e) { fallback(); }
  };

  /* ---------------- static bits ---------------- */
  function renderMarquee(){
    const one = HONEY.map(p => `<span><b>${BIG[p.id]}</b><em>${p.fr.replace(/^Miel (d’|de )?/, '')}</em></span>`).join('');
    $('marquee').innerHTML = one + one;
  }
  function renderFaq(){
    $('faq').innerHTML = t('faq').map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  }
  function applyStatic(){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(el => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    $('front').setAttribute('aria-label', t('front'));
  }
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { if (lang === b.dataset.lang) return; lang = b.dataset.lang; save(); render(); });

  $('front').innerHTML = M.shopfront();
  // pointer depth on the hero jars (desktop)
  if (!reduce && matchMedia('(pointer:fine)').matches) {
    const st = $('stack');
    st.parentElement.addEventListener('pointermove', (e) => {
      const r = st.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      st.querySelectorAll('figure').forEach((f, k) => { const d = [10, 18, 14][k]; f.style.translate = `${(x * d).toFixed(1)}px ${(y * d).toFixed(1)}px`; });
    });
  }

  function render(){
    applyStatic(); renderMarquee(); renderGallery(); renderMap(); renderBox(); renderHouse(); renderFaq(); renderCart();
    if ($('detail').open) renderDetail();
    layout();
  }
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  addEventListener('load', layout);
})();
</script>
</body>
</html>
